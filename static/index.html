<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Agent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface2: #1e2430;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #7a8494;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #3dd68c;
    --red: #f06060;
    --tool-search: #4f8ef7;
    --tool-fetch: #a78bfa;
    --tool-summary: #3dd68c;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header p  { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .badge {
    margin-left: auto;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    background: rgba(79,142,247,0.12);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(79,142,247,0.25);
  }

  main {
    display: grid;
    grid-template-columns: 1fr 380px;
    height: calc(100vh - 73px);
    overflow: hidden;
  }

  .left-pane {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .search-area {
    padding: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .search-area label {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 10px;
  }
  .input-row { display: flex; gap: 10px; align-items: center; }

  #query {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  #query:focus { border-color: var(--accent); }
  #query::placeholder { color: var(--muted); }

  #run-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  #run-btn:hover { opacity: 0.9; }
  #run-btn:active { transform: scale(0.97); }
  #run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border2);
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .steps-area {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }
  .steps-area::-webkit-scrollbar { width: 4px; }
  .steps-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 1rem; opacity: 0.4; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  .step-item {
    display: flex;
    gap: 12px;
    margin-bottom: 1rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

  .step-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .step-content { flex: 1; }
  .step-header {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-iter {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    background: var(--surface2);
    padding: 1px 7px;
    border-radius: 4px;
  }
  .step-text { margin-bottom: 8px; font-size: 13px; color: var(--text); }

  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    padding: 3px 9px;
    border-radius: 5px;
    margin: 3px 3px 3px 0;
  }
  .tool-chip.search  { background: rgba(79,142,247,0.12); color: var(--tool-search); }
  .tool-chip.fetch   { background: rgba(167,139,250,0.12); color: var(--tool-fetch); }
  .tool-chip.summary { background: rgba(61,214,140,0.12);  color: var(--tool-summary); }

  .tool-input-preview {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    background: var(--surface2);
    padding: 6px 10px;
    border-radius: 6px;
    color: var(--muted);
    margin-top: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 1rem;
    border: 1px solid var(--border);
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .right-pane { display: flex; flex-direction: column; overflow: hidden; }
  .right-pane-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .results-area {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }
  .results-area::-webkit-scrollbar { width: 4px; }
  .results-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .result-empty {
    text-align: center;
    padding: 3rem 1.5rem;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  .result-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 1rem;
    line-height: 1.4;
  }
  .result-summary {
    font-size: 14px;
    line-height: 1.75;
    margin-bottom: 1.5rem;
  }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-bottom: 10px;
  }
  .key-points { list-style: none; margin-bottom: 1.5rem; }
  .key-points li {
    font-size: 13px;
    line-height: 1.6;
    padding: 8px 0 8px 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .key-points li::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    transform: translateY(-50%);
  }

  .sources-list { list-style: none; }
  .sources-list li { margin-bottom: 8px; }
  .sources-list a {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    transition: border-color 0.15s, background 0.15s;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .sources-list a:hover { border-color: var(--accent); background: rgba(79,142,247,0.06); }

  .final-text-block {
    font-size: 13px;
    line-height: 1.8;
    background: var(--surface2);
    padding: 1rem 1.25rem;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }

  .stats-bar {
    display: flex;
    gap: 1rem;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
  }
  .stat { display: flex; align-items: center; gap: 5px; }
  .stat span { color: var(--text); font-weight: 500; }
</style>
</head>
<body>

<header>
  <div class="logo">🔬</div>
  <div>
    <h1>Research Agent</h1>
    <p>Agentic AI · tool-use loop · real-time steps</p>
  </div>
  <div class="badge">LOCAL · CLAUDE</div>
</header>

<main>
  <div class="left-pane">
    <div class="search-area">
      <label>Research Query</label>
      <div class="input-row">
        <input id="query" type="text" placeholder="e.g. How does transformer attention work?" />
        <button id="run-btn" onclick="startResearch()">Research ↗</button>
      </div>
      <div class="suggestions">
        <button class="chip" onclick="setQuery('What is retrieval augmented generation?')">RAG in AI</button>
        <button class="chip" onclick="setQuery('How does Bitcoin mining work?')">Bitcoin mining</button>
        <button class="chip" onclick="setQuery('Latest advances in protein folding')">Protein folding</button>
        <button class="chip" onclick="setQuery('How do large language models work?')">How LLMs work</button>
      </div>
    </div>
    <div class="steps-area" id="steps">
      <div class="empty-state">
        <div class="icon">🤖</div>
        <p>The agent will show its reasoning here —<br>every tool call, search, and decision.</p>
      </div>
    </div>
  </div>

  <div class="right-pane">
    <div class="right-pane-header">Research Output</div>
    <div class="results-area" id="results">
      <div class="result-empty">
        Results will appear here once the<br>agent finishes its research loop.
      </div>
    </div>
    <div class="stats-bar" id="stats" style="display:none">
      <div class="stat">Iterations: <span id="stat-iter">—</span></div>
      <div class="stat">Tools called: <span id="stat-tools">—</span></div>
      <div class="stat">Status: <span id="stat-status" style="color:var(--green)">done</span></div>
    </div>
  </div>
</main>

<script>
const API = 'http://localhost:5000';
let isRunning = false;

function setQuery(q) {
  document.getElementById('query').value = q;
  document.getElementById('query').focus();
}

function toolClass(name) {
  if (name === 'web_search') return 'search';
  if (name === 'fetch_page') return 'fetch';
  return 'summary';
}
function toolIcon(name) {
  if (name === 'web_search') return '🔍';
  if (name === 'fetch_page') return '📄';
  return '📋';
}
function dotStyle(tools) {
  if (!tools || tools.length === 0) return 'background:#3dd68c22;color:#3dd68c';
  const n = tools[0].name;
  if (n === 'web_search') return 'background:#4f8ef722;color:#4f8ef7';
  if (n === 'fetch_page') return 'background:#a78bfa22;color:#a78bfa';
  return 'background:#3dd68c22;color:#3dd68c';
}

function addThinking() {
  const el = document.createElement('div');
  el.className = 'thinking';
  el.id = 'thinking-indicator';
  el.innerHTML = '<div class="spinner"></div> Agent is thinking…';
  document.getElementById('steps').appendChild(el);
  document.getElementById('steps').scrollTop = 99999;
}
function removeThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

function renderStep(step) {
  removeThinking();
  const stepsEl = document.getElementById('steps');
  const div = document.createElement('div');
  div.className = 'step-item';

  const toolsHtml = (step.tools_called || []).map(t => `
    <div>
      <span class="tool-chip ${toolClass(t.name)}">${toolIcon(t.name)} ${t.name}</span>
      <div class="tool-input-preview">${JSON.stringify(t.input).slice(0, 120)}</div>
    </div>
  `).join('');

  const textHtml = step.text
    ? `<div class="step-text">${step.text.slice(0, 200)}${step.text.length > 200 ? '…' : ''}</div>`
    : '';

  div.innerHTML = `
    <div class="step-dot" style="${dotStyle(step.tools_called)}">
      ${step.tools_called?.length > 0 ? '⚡' : '✓'}
    </div>
    <div class="step-content">
      <div class="step-header">
        Iteration ${step.iteration}
        <span class="step-iter">${step.stop_reason}</span>
      </div>
      ${textHtml}
      ${toolsHtml}
    </div>
  `;
  stepsEl.appendChild(div);
  stepsEl.scrollTop = 99999;
}

function renderResults(result) {
  const el = document.getElementById('results');
  const s = result.structured;

  if (s && s.title) {
    el.innerHTML = `
      <div class="result-title">${s.title}</div>
      <div class="result-summary">${s.summary}</div>
      <div class="section-label">Key Points</div>
      <ul class="key-points">
        ${s.key_points.map(p => `<li>${p}</li>`).join('')}
      </ul>
      <div class="section-label">Sources</div>
      <ul class="sources-list">
        ${(s.sources || []).map(src =>
          `<li><a href="${src.url}" target="_blank">🔗 ${src.title || src.url}</a></li>`
        ).join('')}
      </ul>
    `;
  } else if (result.final_answer) {
    el.innerHTML = `
      <div class="section-label" style="margin-bottom:12px">Final Answer</div>
      <div class="final-text-block">${result.final_answer}</div>
    `;
  }

  const statsEl = document.getElementById('stats');
  statsEl.style.display = 'flex';
  document.getElementById('stat-iter').textContent = result.total_iterations;
  const totalTools = (result.steps || []).reduce((n, s) => n + (s.tools_called?.length || 0), 0);
  document.getElementById('stat-tools').textContent = totalTools;
  document.getElementById('stat-status').textContent = result.success ? 'done ✓' : 'timeout';
}

async function startResearch() {
  if (isRunning) return;
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  isRunning = true;
  document.getElementById('run-btn').disabled = true;
  document.getElementById('steps').innerHTML = '';
  document.getElementById('results').innerHTML = '<div class="result-empty">Researching…</div>';
  document.getElementById('stats').style.display = 'none';
  addThinking();

  const evtSource = new EventSource(`${API}/api/research/stream?q=${encodeURIComponent(query)}`);

  evtSource.onmessage = (e) => {
    const event = JSON.parse(e.data);
    if (event.type === 'step') {
      renderStep(event.data);
      addThinking();
    } else if (event.type === 'done') {
      removeThinking();
      renderResults(event.data);
      evtSource.close();
      isRunning = false;
      document.getElementById('run-btn').disabled = false;
    } else if (event.type === 'timeout') {
      removeThinking();
      evtSource.close();
      isRunning = false;
      document.getElementById('run-btn').disabled = false;
    }
  };

  evtSource.onerror = () => {
    removeThinking();
    document.getElementById('results').innerHTML =
      '<div class="result-empty" style="color:var(--red)">Connection error. Is the server running?</div>';
    evtSource.close();
    isRunning = false;
    document.getElementById('run-btn').disabled = false;
  };
}

document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter') startResearch();
});
</script>
</body>
</html>
