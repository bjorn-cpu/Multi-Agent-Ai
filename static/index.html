<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Agent AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14; --surface: #161a22; --surface2: #1e2430;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0; --muted: #7a8494;
    --accent: #4f8ef7; --accent2: #7c5cfc;
    --green: #3dd68c; --red: #f06060; --amber: #f5a623;
  }
  [data-theme="light"] {
    --bg: #f5f6fa; --surface: #ffffff; --surface2: #eef0f5;
    --border: rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.12);
    --text: #1a1d23; --muted: #7a8494; --accent: #3b7ef5;
    --accent2: #6c4ef0; --green: #28b870; --red: #e04040; --amber: #d48a00;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    transition: background 0.2s, color 0.2s;
  }

  /* ── Header ── */
  header {
    padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 1rem;
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
  }
  header h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .status-wrap { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); flex-shrink: 0;
    box-shadow: 0 0 5px var(--green); transition: all 0.3s;
  }
  .status-dot.thinking { background: var(--amber); box-shadow: 0 0 5px var(--amber); animation: blink 1s infinite; }
  .status-dot.retrying { background: var(--red); box-shadow: 0 0 5px var(--red); animation: blink 0.5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-label { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .header-actions { display: flex; align-items: center; gap: 5px; }
  .icon-btn {
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); width: 32px; height: 32px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; transition: all 0.15s;
    position: relative;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn title { display: none; }

  /* ── Toast ── */
  .toast-container {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    z-index: 999; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; padding: 8px 16px; font-size: 13px;
    color: var(--text); white-space: nowrap;
    animation: toastIn 0.2s ease, toastOut 0.3s ease 1.7s forwards;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }
  @keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0} }

  /* ── Tabs ── */
  .agent-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    padding: 0 1.5rem; overflow-x: auto; background: var(--bg);
  }
  .agent-tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 16px; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer; border: none;
    background: transparent; border-bottom: 2px solid transparent;
    transition: all 0.15s; white-space: nowrap; font-family: 'DM Sans', sans-serif;
    gap: 2px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-sub { font-size: 10px; color: var(--muted); font-weight: 400; }
  .tab.active .tab-sub { color: rgba(79,142,247,0.7); }

  /* ── Save/Load panel ── */
  .side-panel {
    position: fixed; top: 0; right: -320px; width: 320px; height: 100vh;
    background: var(--surface); border-left: 1px solid var(--border2);
    z-index: 200; transition: right 0.25s ease;
    display: flex; flex-direction: column;
    box-shadow: -8px 0 32px rgba(0,0,0,0.3);
  }
  .side-panel.open { right: 0; }
  .side-panel-header {
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; font-size: 14px;
  }
  .side-panel-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  .side-panel-body { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 10px; }
  .save-input-row { display: flex; gap: 8px; }
  .save-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 13px; padding: 8px 10px; border-radius: 8px; outline: none;
  }
  .save-input:focus { border-color: var(--accent); }
  .small-btn {
    font-size: 12px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--text); cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: all 0.15s; white-space: nowrap;
  }
  .small-btn:hover { border-color: var(--accent); color: var(--accent); }
  .small-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .small-btn.primary:hover { opacity: 0.9; }
  .chat-list { display: flex; flex-direction: column; gap: 6px; }
  .chat-list-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; }
  .chat-item {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .chat-item-info { flex: 1; overflow: hidden; cursor: pointer; }
  .chat-item-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .chat-item-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; transition: color 0.15s; }
  .chat-item-del:hover { color: var(--red); }
  .no-chats { font-size: 12px; color: var(--muted); text-align: center; padding: 1rem; }

  /* ── Chat area ── */
  .chat-wrap { flex: 1; overflow-y: auto; position: relative; }
  .chat-wrap::-webkit-scrollbar { width: 4px; }
  .chat-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  .chat-area {
    padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem;
    max-width: 820px; width: 100%; margin: 0 auto;
    min-height: 100%;
  }

  /* Scroll to top button */
  .scroll-top-btn {
    position: fixed; bottom: 90px; right: 20px;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--muted); cursor: pointer; font-size: 16px;
    display: none; align-items: center; justify-content: center;
    transition: all 0.15s; z-index: 50;
  }
  .scroll-top-btn:hover { border-color: var(--accent); color: var(--accent); }
  .scroll-top-btn.visible { display: flex; }

  /* ── Empty state ── */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 3rem 2rem; color: var(--muted); gap: 0.75rem;
    min-height: 400px;
  }
  .empty-icon {
    font-size: 44px; opacity: 0.2;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .empty-state h2 { font-size: 17px; font-weight: 600; color: var(--text); opacity: 0.4; }
  .empty-state p { font-size: 13px; line-height: 1.6; max-width: 300px; }
  .shortcut-hints { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .shortcut { font-size: 11px; color: var(--muted); background: var(--surface2); border: 1px solid var(--border2); padding: 3px 8px; border-radius: 5px; font-family: 'DM Mono', monospace; }

  /* ── Messages ── */
  .message { display: flex; flex-direction: column; gap: 4px; animation: fadeIn 0.22s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1} }
  .message.user { align-items: flex-end; }
  .message.assistant { align-items: flex-start; }

  .msg-meta { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
  .msg-time { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }

  /* User message actions */
  .user-msg-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 80%; }
  .user-actions { display: flex; gap: 5px; opacity: 0; transition: opacity 0.15s; }
  .message.user:hover .user-actions { opacity: 1; }
  .msg-action-btn {
    font-size: 11px; padding: 2px 8px; border-radius: 5px;
    border: 1px solid var(--border2); background: var(--surface2);
    color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .msg-action-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Edit mode */
  .edit-area {
    width: 100%; background: var(--surface2); border: 1px solid var(--accent);
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 14px; padding: 10px 13px; border-radius: 10px;
    outline: none; resize: none; line-height: 1.5;
    min-height: 42px;
  }
  .edit-actions { display: flex; gap: 6px; margin-top: 4px; }
  .edit-send-btn {
    font-size: 12px; padding: 5px 12px; background: var(--accent);
    border: none; color: #fff; border-radius: 6px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .edit-cancel-btn {
    font-size: 12px; padding: 5px 12px; background: transparent;
    border: 1px solid var(--border2); color: var(--muted); border-radius: 6px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }

  .bubble { max-width: 100%; padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.7; }
  .message.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .message.assistant .bubble { background: var(--surface); border: 1px solid var(--border2); border-bottom-left-radius: 4px; color: var(--text); }
  .message.assistant .bubble.error { border-color: var(--red); color: var(--red); }
  .followup-hint { font-size: 11px; color: var(--muted); padding: 0 4px; font-style: italic; }

  /* Reactions */
  .reactions { display: flex; gap: 4px; padding: 0 2px; }
  .reaction-btn {
    font-size: 13px; padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    cursor: pointer; transition: all 0.15s; opacity: 0.5;
  }
  .reaction-btn:hover { opacity: 1; border-color: var(--border2); background: var(--surface2); }
  .reaction-btn.active { opacity: 1; border-color: var(--accent); background: rgba(79,142,247,0.1); }

  /* ── File upload ── */
  .file-drop {
    border: 2px dashed var(--border2); border-radius: 10px;
    padding: 14px; text-align: center; cursor: pointer;
    transition: all 0.2s; position: relative;
  }
  .file-drop:hover, .file-drop.dragover { border-color: var(--accent); background: rgba(79,142,247,0.05); }
  .file-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .file-drop-text { font-size: 12px; color: var(--muted); pointer-events: none; }
  .file-drop-text span { color: var(--accent); }
  .file-attached {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 7px 12px; font-size: 12px;
  }
  .file-attached-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
  .file-remove:hover { color: var(--red); }

  /* ── Cards ── */
  .card {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; overflow: hidden; max-width: 100%; font-size: 13px;
    width: 100%;
  }
  .card-header {
    padding: 10px 14px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-weight: 600; font-size: 13px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .card-header:hover { background: var(--surface2); }
  .card-header-left { display: flex; align-items: center; gap: 7px; overflow: hidden; flex: 1; }
  .card-header-left span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
  .collapse-btn {
    font-size: 12px; color: var(--muted); background: none; border: none;
    cursor: pointer; padding: 2px 4px; transition: transform 0.2s;
    display: flex; align-items: center;
  }
  .collapse-btn.collapsed { transform: rotate(-90deg); }

  .copy-btn {
    font-size: 11px; padding: 3px 10px; background: transparent;
    border: 1px solid var(--border2); color: var(--muted); border-radius: 6px;
    cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--green) !important; color: var(--green) !important; }

  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card-body.collapsed { display: none; }

  .section-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; }
  .key-points { list-style: none; }
  .key-points li { font-size: 13px; line-height: 1.65; padding: 6px 0 6px 14px; border-bottom: 1px solid var(--border); position: relative; color: var(--text); }
  .key-points li:last-child { border-bottom: none; }
  .key-points li::before { content:''; position:absolute; left:0; top:50%; width:5px; height:5px; background:var(--accent); border-radius:50%; transform:translateY(-50%); }
  .sources-list { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .sources-list a { font-size:12px; color:var(--accent); text-decoration:none; display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:6px; border:1px solid var(--border); transition:all 0.15s; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .sources-list a:hover { border-color:var(--accent); background:rgba(79,142,247,0.06); }

  /* Code block — single copy button, top right */
  .code-wrapper { position: relative; }
  .code-wrapper pre { margin:0; border-radius:8px; border:1px solid var(--border); font-size:12px; line-height:1.7; overflow-x:auto; }
  .code-wrapper pre code { border-radius:8px; white-space: pre-wrap; word-break: break-word; }
  .code-copy-btn {
    position:absolute; top:8px; right:8px; font-size:11px; padding:3px 8px;
    background:var(--surface2); border:1px solid var(--border2);
    color:var(--muted); border-radius:5px; cursor:pointer;
    font-family:'DM Sans',sans-serif; transition:all 0.15s; z-index: 1;
  }
  .code-copy-btn:hover { border-color:var(--accent); color:var(--accent); }
  .code-copy-btn.copied { border-color:var(--green); color:var(--green); }

  .answer-highlight { font-size:22px; font-weight:700; color:var(--green); background:rgba(61,214,140,0.08); padding:12px 16px; border-radius:8px; text-align:center; }
  .fun-fact { font-size:12px; padding:7px 12px; background:rgba(245,166,35,0.08); border-left:3px solid var(--amber); border-radius:0 4px 4px 0; line-height:1.6; }
  .wiki-section { display:flex; flex-direction:column; gap:4px; }
  .wiki-section h4 { font-size:13px; font-weight:600; color:var(--accent); }
  .wiki-section p { font-size:13px; line-height:1.7; }
  .retry-btn { font-size:12px; padding:5px 12px; background:transparent; border:1px solid var(--red); color:var(--red); border-radius:6px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.15s; margin-top:4px; }
  .retry-btn:hover { background:rgba(240,96,96,0.1); }

  /* ── Thinking ── */
  .thinking-bubble { background:var(--surface); border:1px solid var(--border2); border-radius:14px; border-bottom-left-radius:4px; padding:11px 15px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  .dot-pulse { display:flex; gap:4px; }
  .dot-pulse span { width:6px; height:6px; background:var(--muted); border-radius:50%; animation:pulse 1.2s ease-in-out infinite; }
  .dot-pulse span:nth-child(2) { animation-delay:0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay:0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }

  /* ── Input bar ── */
  .input-bar { border-top: 1px solid var(--border); padding: 0.75rem 1.5rem; background: var(--bg); }
  .input-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .input-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .suggestions { display:flex; gap:5px; flex-wrap:wrap; flex:1; }
  .chip { font-size:11px; padding:3px 10px; border-radius:20px; border:1px solid var(--border2); color:var(--muted); cursor:pointer; background:transparent; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .input-meta { display:flex; gap:5px; align-items:center; flex-shrink:0; }
  .mic-btn { font-size:11px; padding:3px 10px; border-radius:6px; border:1px solid var(--border2); color:var(--muted); cursor:pointer; background:var(--surface2); font-family:'DM Sans',sans-serif; transition:all 0.15s; }
  .mic-btn:hover { border-color:var(--accent); color:var(--accent); }
  .mic-btn.recording { border-color:var(--red); color:var(--red); animation:blink 1s infinite; }
  .history-wrap { position:relative; }
  .history-btn { font-size:11px; padding:3px 10px; border-radius:6px; border:1px solid var(--border2); color:var(--muted); cursor:pointer; background:var(--surface2); font-family:'DM Sans',sans-serif; transition:all 0.15s; }
  .history-btn:hover { border-color:var(--accent); color:var(--accent); }
  .history-dropdown { position:absolute; bottom:110%; right:0; background:var(--surface); border:1px solid var(--border2); border-radius:8px; min-width:240px; max-height:220px; overflow-y:auto; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.3); display:none; }
  .history-dropdown.open { display:block; }
  .history-item { padding:8px 12px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--border); color:var(--text); transition:background 0.1s; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .history-item:last-child { border-bottom:none; }
  .history-item:hover { background:var(--surface2); }
  .history-empty { padding:12px; font-size:12px; color:var(--muted); text-align:center; }
  .input-row { display:flex; gap:8px; align-items:flex-end; }
  #query { flex:1; background:var(--surface2); border:1px solid var(--border2); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; padding:10px 13px; border-radius:10px; outline:none; transition:border-color 0.2s; resize:none; min-height:42px; max-height:140px; line-height:1.5; }
  #query:focus { border-color:var(--accent); }
  #query::placeholder { color:var(--muted); }
  .input-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  #run-btn { background:var(--accent); color:#fff; border:none; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; padding:10px 18px; border-radius:10px; cursor:pointer; transition:opacity 0.2s,transform 0.1s; white-space:nowrap; height:42px; }
  #run-btn:hover { opacity:0.9; }
  #run-btn:active { transform:scale(0.97); }
  #run-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .input-bottom-row { display:flex; justify-content:space-between; align-items:center; }
  .char-count { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
  .char-count.warn { color:var(--amber); }
  .word-count { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; }
</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>
<button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" title="Scroll to top">↑</button>

<header>
  <h1>Multi-Agent AI</h1>
  <div class="status-wrap">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-label" id="status-label">ready</span>
  </div>
  <div class="header-actions">

<div class="agent-tabs">

<script>
const API = 'http://localhost:5000';
let isRunning = false;
let currentAgent = 'research';
let isDark = true;
let lastQuery = '';
let thinkingInterval = null;
let historyIndex = -1;
let attachedFileContent = null;
let attachedFileName = null;
let recognition = null;
let isRecording = false;
let chatMessages = [];

const queryHistory = { research:[], code:[], summarizer:[], math:[], wiki:[] };

const THINKING_MESSAGES = {
  research: ['Searching the web…','Reading articles…','Gathering sources…','Analyzing results…','Almost done…'],
  code:     ['Reading your code…','Analyzing logic…','Checking for issues…','Writing solution…','Almost done…'],
  summarizer:['Reading the text…','Finding key points…','Structuring summary…','Wrapping up…','Almost done…'],
  math:     ['Reading the problem…','Working through steps…','Checking the math…','Writing solution…','Almost done…'],
  wiki:     ['Searching the web…','Reading articles…','Finding fun facts…','Structuring breakdown…','Almost done…']
};

const AGENT_CONFIG = {
  research: {
    icon:'🔬', name:'Research Agent',
    desc:'Searches the real web and summarizes for you.',
    placeholder:'e.g. What happened in AI this week?',
    suggestions:['Latest AI news','How does GPS work?','What is CRISPR?'],
    followup:'Try "tell me more about X" or "what caused that?"',
    fileUpload: false
  },
  code: {
    icon:'💻', name:'Code Agent',
    desc:'Paste code to review, or describe what you want built.',
    placeholder:'e.g. Write a Python function to reverse a string',
    suggestions:['Write a Python web scraper','Explain: for i in range(10)','Write a REST API in Flask'],
    followup:'Try "now do it in JavaScript" or "add error handling"',
    fileUpload: false
  },
  summarizer: {
    icon:'📝', name:'Summarizer Agent',
    desc:'Upload a file or paste text for a clean summary.',
    placeholder:'Paste text here, or upload a file above…',
    suggestions:['Summarize: [paste any text]'],
    followup:'Try "expand on point 3" or "what was the conclusion?"',
    fileUpload: true
  },
  math: {
    icon:'🧮', name:'Math Agent',
    desc:'Type any math problem — algebra, calculus, statistics.',
    placeholder:'e.g. Solve x² + 5x + 6 = 0',
    suggestions:['Solve: 2x + 5 = 13','Derivative of x³?','Pythagoras: a=3, b=4'],
    followup:'Try "explain step 2 more" or "solve it a different way"',
    fileUpload: false
  },
  wiki: {
    icon:'📚', name:'Wikipedia Agent',
    desc:'Deep-dive on any topic using real web sources.',
    placeholder:'e.g. Tell me about the Roman Empire',
    suggestions:['The Roman Empire','How vaccines work','History of AI'],
    followup:'Try "tell me more about X from that"',
    fileUpload: false
  }
};

// ── Toast notifications ──
function toast(msg, type='') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ── Status ──
function setStatus(state) {
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  dot.className = 'status-dot' + (state !== 'ready' ? ' ' + state : '');
  label.textContent = state;
}

// ── Theme ──
function toggleTheme() {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
}

// ── Scroll ──
function scrollToBottom() {
  const wrap = document.getElementById('chat-wrap');
  wrap.scrollTo({top: wrap.scrollHeight, behavior:'smooth'});
}
function scrollToTop() {
  document.getElementById('chat-wrap').scrollTo({top:0, behavior:'smooth'});
}

// Show/hide scroll-to-top button
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.getElementById('chat-wrap');
  wrap.addEventListener('scroll', () => {
    const btn = document.getElementById('scroll-top-btn');
    btn.classList.toggle('visible', wrap.scrollTop > 400);
  });

  // Drag and drop
  const drop = document.getElementById('file-drop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('dragover');
      if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
    });
  }
});

// ── Save/Load panel ──
function toggleSavePanel() {
  const panel = document.getElementById('side-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) loadChatList();
}

async function loadChatList() {
  try {
    const res = await fetch(`${API}/api/list_chats`);
    const data = await res.json();
    const list = document.getElementById('chat-list');
    if (!data.chats.length) { list.innerHTML = '<div class="no-chats">No saved chats yet</div>'; return; }
    list.innerHTML = data.chats.map(c => `
      <div class="chat-item">
        <div class="chat-item-info" onclick="loadChat('${c.filename}')">
          <div class="chat-item-name">${esc(c.name)}</div>
          <div class="chat-item-meta">${c.agent} · ${c.message_count} messages</div>
        </div>
        <button class="chat-item-del" onclick="deleteChat('${c.filename}')">🗑</button>
      </div>`).join('');
  } catch(e) { toast('Could not load chats', 'error'); }
}

async function saveChat() {
  const name = document.getElementById('chat-name').value.trim() || 'chat';
  if (!chatMessages.length) { toast('Nothing to save yet'); return; }
  await fetch(`${API}/api/save_chat`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, agent: currentAgent, messages: chatMessages })
  });
  document.getElementById('chat-name').value = '';
  toast('Chat saved ✓', 'success');
  loadChatList();
}

async function loadChat(filename) {
  const res = await fetch(`${API}/api/load_chat`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({filename})
  });
  const data = await res.json();
  if (data.error) { toast(data.error, 'error'); return; }
  const tab = document.querySelector(`.tab[data-agent="${data.agent}"]`);
  if (tab) switchAgent(tab);
  clearChat(true);
  chatMessages = data.messages || [];
  chatMessages.forEach(msg => {
    if (msg.role === 'user') addUserMessage(msg.text, true);
    else if (msg.role === 'assistant') restoreAssistantMessage(msg);
  });
  toggleSavePanel();
  toast('Chat loaded ✓', 'success');
}

async function deleteChat(filename) {
  if (!confirm('Delete this chat?')) return;
  await fetch(`${API}/api/delete_chat`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({filename})
  });
  toast('Chat deleted');
  loadChatList();
}

// ── Clear chat ──
function clearChat(silent=false) {
  const cfg = AGENT_CONFIG[currentAgent];
  chatMessages = [];
  document.getElementById('chat').innerHTML = `
    <div class="empty-state" id="empty">
      <div class="empty-icon">${cfg.icon}</div>
      <h2>${cfg.name}</h2>
      <p>${cfg.desc}</p>
      <div class="shortcut-hints">
        <span class="shortcut">Enter → send</span>
        <span class="shortcut">Shift+Enter → new line</span>
        <span class="shortcut">↑ → last query</span>
        <span class="shortcut">Ctrl+K → focus</span>
      </div>
    </div>`;
  if (!silent) {
    fetch(`${API}/api/reset`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({agent: currentAgent})
    });
  }
  setStatus('ready');
}

// ── Switch agent ──
function switchAgent(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentAgent = tab.dataset.agent;
  const cfg = AGENT_CONFIG[currentAgent];
  document.getElementById('query').placeholder = cfg.placeholder;
  renderSuggestions(cfg.suggestions);
  document.getElementById('file-upload-area').style.display = cfg.fileUpload ? 'block' : 'none';
  clearChat();
  closeHistory();
  historyIndex = -1;
  removeFile();
}

// ── File upload ──
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  uploadFile(file);
}

function uploadFile(file) {
  toast('Uploading file…');
  const formData = new FormData();
  formData.append('file', file);
  fetch(`${API}/api/upload_file`, { method:'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.error) { toast('File error: ' + data.error, 'error'); return; }
      attachedFileContent = data.content;
      attachedFileName = data.filename;
      document.getElementById('file-attached').style.display = 'flex';
      document.getElementById('file-attached-name').textContent =
        data.filename + ' (' + (data.length/1000).toFixed(1) + 'k chars)';
      document.getElementById('file-drop').style.display = 'none';
      toast('File ready ✓', 'success');
    });
}

function removeFile() {
  attachedFileContent = null;
  attachedFileName = null;
  const attached = document.getElementById('file-attached');
  const drop = document.getElementById('file-drop');
  const input = document.getElementById('file-input');
  if (attached) attached.style.display = 'none';
  if (drop) drop.style.display = 'block';
  if (input) input.value = '';
}

// ── Voice input ──
function toggleVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { toast('Voice not supported. Use Chrome.', 'error'); return; }
  if (isRecording) { recognition.stop(); return; }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-btn').textContent = '🔴 Stop';
  };
  recognition.onresult = (e) => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('query').value = final || interim;
    autoResize(); updateCharCount();
  };
  recognition.onend = () => {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-btn').textContent = '🎤 Voice';
  };
  recognition.onerror = (e) => {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-btn').textContent = '🎤 Voice';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      toast('Mic blocked on http://. Launch Chrome with the --unsafely flag.', 'error');
    }
  };
  try { recognition.start(); } catch(e) { toast('Could not start voice: ' + e.message, 'error'); }
}

// ── Suggestions ──
function renderSuggestions(list) {
  document.getElementById('suggestions').innerHTML = list.map(s =>
    `<button class="chip" onclick="setQuery('${s.replace(/'/g,"\\'")}')">${s}</button>`
  ).join('');
}

function setQuery(q) {
  document.getElementById('query').value = q;
  document.getElementById('query').focus();
  autoResize(); updateCharCount();
}

// ── History ──
function addToHistory(query) {
  const h = queryHistory[currentAgent];
  const idx = h.indexOf(query);
  if (idx !== -1) h.splice(idx, 1);
  h.unshift(query);
  if (h.length > 10) h.pop();
}

function toggleHistory() {
  const dd = document.getElementById('history-dropdown');
  dd.classList.toggle('open');
  if (dd.classList.contains('open')) renderHistoryDropdown();
}

function closeHistory() {
  document.getElementById('history-dropdown').classList.remove('open');
}

function renderHistoryDropdown() {
  const h = queryHistory[currentAgent];
  const dd = document.getElementById('history-dropdown');
  if (!h.length) { dd.innerHTML = '<div class="history-empty">No history yet for this agent</div>'; return; }
  dd.innerHTML = h.map((q, i) => {
    const display = q.replace(/\n/g,' ').slice(0,55);
    const safe = q.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
    return `<div class="history-item" onclick="setQuery('${safe}');closeHistory()">
      <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;margin-right:6px">${i+1}</span>
      ${display}${q.length>55?'…':''}
    </div>`;
  }).join('');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.history-wrap')) closeHistory();
  if (!e.target.closest('.side-panel') && !e.target.closest('.icon-btn')) {
    document.getElementById('side-panel').classList.remove('open');
  }
});

// ── Input helpers ──
function autoResize() {
  const el = document.getElementById('query');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function updateCharCount() {
  const val = document.getElementById('query').value;
  const chars = document.getElementById('char-count');
  const words = document.getElementById('word-count');
  chars.textContent = val.length + ' chars';
  chars.className = 'char-count' + (val.length > 800 ? ' warn' : '');
  const wc = val.trim() ? val.trim().split(/\s+/).length : 0;
  words.textContent = wc > 0 ? wc + ' words' : '';
}

// ── Copy (http-safe) ──
function copyText(text, btn) {
  const doFlash = () => {
    const orig = btn.textContent;
    btn.textContent = 'Copied ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
    toast('Copied to clipboard', 'success');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(doFlash);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); doFlash(); } catch(e) { toast('Copy failed', 'error'); }
    document.body.removeChild(ta);
  }
}

function buildCopyText(result) {
  const s = result.structured;
  if (!s) return result.final_answer || '';
  if (s.title && s.key_points && s.summary) return `${s.title}\n\n${s.summary}\n\nKey Points:\n${s.key_points.map(p=>`• ${p}`).join('\n')}`;
  if (s.code) return s.code;
  if (s.issues) return `Code Review (${s.language})\n\nExplanation: ${s.explanation}\n\nIssues:\n${s.issues.map(i=>`• ${i}`).join('\n')}\n\nSuggestions:\n${s.suggestions.map(i=>`• ${i}`).join('\n')}`;
  if (s.one_liner) return `${s.title}\n\nTL;DR: ${s.one_liner}\n\nKey Points:\n${s.key_points.map(p=>`• ${p}`).join('\n')}\n\nConclusion: ${s.conclusion}`;
  if (s.answer && s.steps) return `${s.problem}\n\nAnswer: ${s.answer}\n\nSteps:\n${s.steps.map(p=>`• ${p}`).join('\n')}`;
  if (s.sections) return `${s.topic}\n\n${s.overview}\n\n${s.sections.map(sec=>`${sec.heading}\n${sec.content}`).join('\n\n')}`;
  return JSON.stringify(s, null, 2);
}

function nowTime() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function codeBlock(code, lang) {
  const id = 'cb' + Math.random().toString(36).slice(2);
  let highlighted;
  try { highlighted = hljs.highlight(code, {language: lang||'plaintext', ignoreIllegals:true}).value; }
  catch(e) { highlighted = esc(code); }
  return `<div class="code-wrapper">
    <pre><code class="hljs">${highlighted}</code></pre>
    <button class="code-copy-btn" id="${id}-btn">Copy</button>
    <span id="${id}" style="display:none">${esc(code)}</span>
  </div>`;
}

function wireCodeCopyBtns(container) {
  container.querySelectorAll('.code-copy-btn').forEach(btn => {
    const id = btn.id.replace('-btn','');
    const src = document.getElementById(id);
    if (src) btn.onclick = () => copyText(src.textContent, btn);
  });
}

// ── Collapse/expand cards ──
function toggleCard(btn) {
  const body = btn.closest('.card').querySelector('.card-body');
  body.classList.toggle('collapsed');
  btn.classList.toggle('collapsed');
  btn.textContent = body.classList.contains('collapsed') ? '▶' : '▼';
}

function removeEmpty() {
  const e = document.getElementById('empty');
  if (e) e.remove();
}

// ── User message with edit ──
function addUserMessage(text, restore=false) {
  removeEmpty();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message user';
  const msgId = 'um' + Math.random().toString(36).slice(2);
  div.id = msgId;
  div.innerHTML = `
    <div class="user-msg-wrap">
      <div class="user-actions">
        <button class="msg-action-btn" onclick="editMessage('${msgId}', this)">✏️ Edit</button>
      </div>
      <div class="bubble">${esc(text)}</div>
    </div>
    <div class="msg-meta">
      <span class="msg-time">${nowTime()}</span>
    </div>`;
  chat.appendChild(div);
  if (!restore) chatMessages.push({role:'user', text});
  scrollToBottom();
}

function editMessage(msgId, btn) {
  const msgDiv = document.getElementById(msgId);
  const wrap = msgDiv.querySelector('.user-msg-wrap');
  const bubble = wrap.querySelector('.bubble');
  const originalText = bubble.textContent;

  wrap.innerHTML = `
    <textarea class="edit-area" id="edit-${msgId}">${esc(originalText)}</textarea>
    <div class="edit-actions">
      <button class="edit-send-btn" onclick="submitEdit('${msgId}', '${esc(originalText)}')">Send ↗</button>
      <button class="edit-cancel-btn" onclick="cancelEdit('${msgId}', '${esc(originalText)}')">Cancel</button>
    </div>`;

  const ta = document.getElementById('edit-' + msgId);
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

function cancelEdit(msgId, originalText) {
  const msgDiv = document.getElementById(msgId);
  const wrap = msgDiv.querySelector('.user-msg-wrap');
  wrap.innerHTML = `
    <div class="user-actions">
      <button class="msg-action-btn" onclick="editMessage('${msgId}', this)">✏️ Edit</button>
    </div>
    <div class="bubble">${esc(originalText)}</div>`;
}

function submitEdit(msgId, originalText) {
  const ta = document.getElementById('edit-' + msgId);
  const newText = ta.value.trim();
  if (!newText || isRunning) return;

  // Restore bubble with new text
  const msgDiv = document.getElementById(msgId);
  const wrap = msgDiv.querySelector('.user-msg-wrap');
  wrap.innerHTML = `
    <div class="user-actions">
      <button class="msg-action-btn" onclick="editMessage('${msgId}', this)">✏️ Edit</button>
    </div>
    <div class="bubble">${esc(newText)}</div>`;

  // Remove all messages after this one
  const chat = document.getElementById('chat');
  const allMsgs = Array.from(chat.children);
  const idx = allMsgs.indexOf(msgDiv);
  allMsgs.slice(idx + 1).forEach(el => el.remove());

  // Reset backend memory and rerun
  fetch(`${API}/api/reset`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({agent: currentAgent})
  }).then(() => {
    lastQuery = newText;
    runQuery(newText);
  });
}

function restoreAssistantMessage(msg) {
  if (msg.result) renderResult(msg.result, true);
  else {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.innerHTML = `<div class="bubble">${esc(msg.text||'')}</div><div class="msg-meta"><span class="msg-time">${nowTime()}</span></div>`;
    chat.appendChild(div);
  }
}

function addThinking() {
  removeEmpty();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message assistant'; div.id = 'thinking-msg';
  const messages = THINKING_MESSAGES[currentAgent];
  let idx = 0;
  div.innerHTML = `<div class="thinking-bubble"><div class="dot-pulse"><span></span><span></span><span></span></div><span id="thinking-text">${messages[0]}</span></div>`;
  chat.appendChild(div);
  scrollToBottom();
  thinkingInterval = setInterval(() => {
    idx = (idx+1) % messages.length;
    const el = document.getElementById('thinking-text');
    if (el) el.textContent = messages[idx];
  }, 2200);
}

function removeThinking() {
  clearInterval(thinkingInterval); thinkingInterval = null;
  const el = document.getElementById('thinking-msg');
  if (el) el.remove();
}

// ── Render result ──
function renderResult(result, restore=false) {
  removeThinking();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message assistant';
  const s = result.structured;
  const copyAll = buildCopyText(result);
  const cfg = AGENT_CONFIG[currentAgent];
  const cardId = 'card' + Math.random().toString(36).slice(2);

  function copyBtn(text, label='Copy') {
    const id = 'cp' + Math.random().toString(36).slice(2);
    setTimeout(() => {
      const btn = document.getElementById(id);
      if (btn) btn.onclick = () => copyText(text, btn);
    }, 0);
    return `<button class="copy-btn" id="${id}">${label}</button>`;
  }

  function collapseBtn() {
    return `<button class="collapse-btn" onclick="toggleCard(this)" title="Collapse">▼</button>`;
  }

  let html = '';

  if (!s) {
    html = `<div class="bubble">${esc(result.final_answer||'No result.')}</div>`;
  }
  // Research
  else if (s.title && s.key_points && s.sources !== undefined && !s.sections && !s.one_liner) {
    html = `<div class="card" id="${cardId}">
      <div class="card-header">
        <div class="card-header-left">🔬 <span>${esc(s.title)}</span></div>
        <div class="card-actions">${copyBtn(copyAll)}${collapseBtn()}</div>
      </div>
      <div class="card-body">
        <div><div class="section-label">Summary</div><p style="font-size:13px;line-height:1.7">${esc(s.summary)}</p></div>
        <div><div class="section-label">Key Points</div><ul class="key-points">${s.key_points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
        ${s.sources?.length?`<div><div class="section-label">Sources</div><ul class="sources-list">${s.sources.map(src=>`<li><a href="${src.url}" target="_blank">🔗 ${esc(src.title||src.url)}</a></li>`).join('')}</ul></div>`:''}
      </div>
    </div>`;
  }
  // Code write
  else if (s.code) {
    const cb = codeBlock(s.code, s.language?.toLowerCase());
    html = `<div class="card" id="${cardId}">
      <div class="card-header">
        <div class="card-header-left">💻 <span>${esc(s.language)} Solution</span></div>
        <div class="card-actions">${collapseBtn()}</div>
      </div>
      <div class="card-body">
        ${cb}
        <div><div class="section-label">Explanation</div><p style="font-size:13px;line-height:1.7">${esc(s.explanation)}</p></div>
      </div>
    </div>`;
  }
  // Code review
  else if (s.issues) {
    html = `<div class="card" id="${cardId}">
      <div class="card-header">
        <div class="card-header-left">💻 <span>Code Review — ${esc(s.language)}</span></div>
        <div class="card-actions">${copyBtn(copyAll)}${collapseBtn()}</div>
      </div>
      <div class="card-body">
        <div><div class="section-label">What it does</div><p style="font-size:13px;line-height:1.7">${esc(s.explanation)}</p></div>
        <div><div class="section-label">Issues</div><ul class="key-points">${(s.issues||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
        <div><div class="section-label">Suggestions</div><ul class="key-points">${(s.suggestions||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
      </div>
    </div>`;
  }
  // Summarizer
  else if (s.one_liner) {
    html = `<div class="card" id="${cardId}">
      <div class="card-header">
        <div class="card-header-left">📝 <span>${esc(s.title)}</span></div>
        <div class="card-actions">${copyBtn(copyAll)}${collapseBtn()}</div>
      </div>
      <div class="card-body">
        <div><div class="section-label">TL;DR</div><p style="font-size:13px;line-height:1.7;font-style:italic">${esc(s.one_liner)}</p></div>
        <div><div class="section-label">Key Points</div><ul class="key-points">${(s.key_points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
        <div><div class="section-label">Conclusion</div><p style="font-size:13px;line-height:1.7">${esc(s.conclusion)}</p></div>
      </div>
    </div>`;
  }
  // Math
  else if (s.answer && s.steps) {
    html = `<div class="card" id="${cardId}">
      <div class="card-header">
        <div class="card-header-left">🧮 <span>${esc(s.problem)}</span></div>
        <div class="card-actions">${copyBtn(copyAll)}${collapseBtn()}</div>
      </div>
      <div class="card-body">
        <div class="answer-highlight">= ${esc(s.answer)}</div>
        <div><div class="section-label">Step by Step</div><ul class="key-points">${(s.steps||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
        <div><div class="section-label">Explanation</div><p style="font-size:13px;line-height:1.7">${esc(s.explanation)}</p></div>
      </div>
    </div>`;
  }
  // Wiki
  else if (s.sections) {
    const sectionsHtml = (s.sections||[]).map(sec=>`
      <div class="wiki-section"><h4>${esc(sec.heading)}</h4><p>${esc(sec.content)}</p></div>`).join('');
    const factsHtml = (s.fun_facts||[]).map(f=>`<div class="fun-fact">💡 ${esc(f)}</div>`).join('');
    html = `<div class="card" id="${cardId}">
      <div class="card-header">
        <div class="card-header-left">📚 <span>${esc(s.topic)}</span></div>
        <div class="card-actions">${copyBtn(copyAll)}${collapseBtn()}</div>
      </div>
      <div class="card-body">
        <div><div class="section-label">Overview</div><p style="font-size:13px;line-height:1.7">${esc(s.overview)}</p></div>
        <div style="display:flex;flex-direction:column;gap:12px">${sectionsHtml}</div>
        <div><div class="section-label">Fun Facts</div><div style="display:flex;flex-direction:column;gap:6px">${factsHtml}</div></div>
        ${s.sources?.length?`<div><div class="section-label">Sources</div><ul class="sources-list">${(s.sources||[]).map(src=>`<li><a href="${src.url}" target="_blank">🔗 ${esc(src.title||src.url)}</a></li>`).join('')}</ul></div>`:''}
      </div>
    </div>`;
  }
  else {
    html = `<div class="bubble">${esc(result.final_answer||JSON.stringify(s))}</div>`;
  }

  // Reactions
  const reactionId = 'rx' + Math.random().toString(36).slice(2);
  const reactionsHtml = `
    <div class="reactions" id="${reactionId}">
      <button class="reaction-btn" onclick="react('${reactionId}', 'up', this)">👍</button>
      <button class="reaction-btn" onclick="react('${reactionId}', 'down', this)">👎</button>
    </div>`;

  div.innerHTML = html + `
    <div class="msg-meta">
      <span class="msg-time">${nowTime()}</span>
    </div>
    ${reactionsHtml}
    <div class="followup-hint">${cfg.followup}</div>`;

  chat.appendChild(div);
  wireCodeCopyBtns(div);

  if (!restore) chatMessages.push({role:'assistant', result});
  setStatus('ready');
  scrollToBottom();
}

function react(reactionId, type, btn) {
  const container = document.getElementById(reactionId);
  const btns = container.querySelectorAll('.reaction-btn');
  btns.forEach(b => b.classList.remove('active'));
  if (!btn.classList.contains('active')) {
    btn.classList.add('active');
    toast(type === 'up' ? 'Thanks for the feedback! 👍' : 'Got it, will do better 👎');
  }
}

function renderError(message) {
  removeThinking();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `
    <div class="bubble error">⚠️ ${esc(message)}</div>
    <button class="retry-btn" onclick="retryLast()">↺ Retry</button>
    <div class="msg-meta"><span class="msg-time">${nowTime()}</span></div>`;
  chat.appendChild(div);
  setStatus('ready');
  scrollToBottom();
}

function retryLast() {
  if (!lastQuery || isRunning) return;
  const chat = document.getElementById('chat');
  const msgs = chat.querySelectorAll('.message.assistant');
  const last = msgs[msgs.length-1];
  if (last) last.remove();
  runQuery(lastQuery);
}

// ── Send ──
async function sendMessage() {
  if (isRunning) return;
  let query = document.getElementById('query').value.trim();
  if (!query && !attachedFileContent) return;
  if (attachedFileContent) {
    query = (query ? query + '\n\n' : 'Summarize this:\n\n') + attachedFileContent;
  }
  lastQuery = query;
  historyIndex = -1;
  const displayQuery = document.getElementById('query').value.trim() || query.slice(0,60);
  addToHistory(displayQuery);
  document.getElementById('query').value = '';
  autoResize(); updateCharCount();
  runQuery(query);
}

function runQuery(query) {
  isRunning = true;
  document.getElementById('run-btn').disabled = true;
  setStatus('thinking');
  const displayText = query.length > 200 ? query.slice(0,200) + '… [file content]' : query;
  addUserMessage(displayText);
  addThinking();

  const url = `${API}/api/stream?q=${encodeURIComponent(query)}&agent=${currentAgent}`;
  const evtSource = new EventSource(url);

  evtSource.onmessage = (e) => {
    const event = JSON.parse(e.data);
    if (event.type === 'step') {
      if (JSON.stringify(event.data).includes('retry')) setStatus('retrying');
    } else if (event.type === 'done') {
      if (event.data.success || event.data.structured || event.data.final_answer) {
        renderResult(event.data);
      } else {
        renderError('The agent could not complete the request. Try again.');
      }
      evtSource.close();
      isRunning = false;
      document.getElementById('run-btn').disabled = false;
    } else if (event.type === 'timeout') {
      renderError('Request timed out. Please try again.');
      evtSource.close();
      isRunning = false;
      document.getElementById('run-btn').disabled = false;
    }
  };

  evtSource.onerror = () => {
    renderError('Connection error. Make sure the server is running.');
    evtSource.close();
    isRunning = false;
    document.getElementById('run-btn').disabled = false;
    setStatus('ready');
  };
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('query').focus();
  }
});

document.getElementById('query').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); return; }
  if (e.key === 'ArrowUp' && document.getElementById('query').value === '') {
    const h = queryHistory[currentAgent];
    if (h.length) { historyIndex = Math.min(historyIndex+1, h.length-1); setQuery(h[historyIndex]); }
    e.preventDefault();
  }
  if (e.key === 'ArrowDown') {
    historyIndex = Math.max(historyIndex-1, -1);
    setQuery(historyIndex >= 0 ? queryHistory[currentAgent][historyIndex] : '');
    e.preventDefault();
  }
});

document.getElementById('query').addEventListener('input', () => { autoResize(); updateCharCount(); });

// Init
renderSuggestions(AGENT_CONFIG.research.suggestions);
</script>
</body>
</html>
